name: Command Centre sync
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/sync.mjs"
      - "command-centre.config.json"
      - ".github/workflows/command-centre-sync.yml"
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 18 * * *"
permissions:
  contents: write
  actions: read
  deployments: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run ZesaTracker sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_READ_TOKEN: ${{ secrets.GH_READ_TOKEN }}
        run: node scripts/sync.mjs
      - name: Commit sync data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status.json data/auto-tasks.json
          git diff --cached --quiet || git commit -m "chore: update ZesaTracker status"
          git push
