name: Command Centre sync
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/sync.mjs"
      - "command-centre.config.json"
      - ".github/workflows/command-centre-sync.yml"
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 18 * * *"
permissions:
  contents: write
  actions: read
  deployments: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate sync script and project configuration
        run: |
          set -euo pipefail
          node --check scripts/sync.mjs
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const config = JSON.parse(fs.readFileSync("command-centre.config.json", "utf8"));
          if (!Array.isArray(config.sites) || config.sites.length !== 3) {
            throw new Error("Expected exactly three monitored production websites.");
          }
          if (!Array.isArray(config.repos) || config.repos.length !== 3) {
            throw new Error("Expected exactly three monitored GitHub repositories.");
          }
          for (const site of config.sites) new URL(site.url);
          for (const item of config.repos) {
            if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(item.repo)) {
              throw new Error("Invalid GitHub repository name: " + item.repo);
            }
          }
          console.log("Three websites and three repositories configured.");
          NODE
      - name: Run three-project sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_READ_TOKEN: ${{ secrets.GH_READ_TOKEN }}
        run: node scripts/sync.mjs
      - name: Commit sync data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status.json data/auto-tasks.json
          git diff --cached --quiet || git commit -m "chore: update ZesaTracker status"
          git push
